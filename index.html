<!DOCTYPE html>
<html>

<head>
<title>Cool Cat Page!</title>
<style>
  body {
    background: linear-gradient(135deg, #b3e5ff, #5dade2, #1f4e79);
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
    padding: 30px;
    color: #12324a;
  }

  .page {
    background: rgba(255, 255, 255, 0.92);
    max-width: 780px;
    margin: auto;
    padding: 30px;
    border-radius: 25px;
    box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
    border: 3px solid #d6f3ff;
  }

  h1 {
    color: #0b4f8a;
    font-size: 42px;
    text-shadow: 2px 2px 0 #b3e5ff;
  }

  h2 {
    color: #1f4e79;
    margin-top: 35px;
  }

  p {
    font-size: 18px;
    line-height: 1.5;
  }

  img, video {
    border-radius: 20px;
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.28);
    border: 4px solid #b3e5ff;
    margin-top: 10px;
  }

  a {
    color: white;
    background: #1f4e79;
    padding: 10px 16px;
    border-radius: 999px;
    text-decoration: none;
    font-weight: bold;
    display: inline-block;
  }

  a:hover {
    background: #5dade2;
  }
</style>
</head>

<body>
<div class="page">

<h1>Welcome to My Cool Cat Page!</h1>
<p>This is made with HTML and CSS!</p>

<h2>This is an image of a cat:</h2>
<p><i>Here is a cat picture:</i></p>
<img src="https://marketplace.canva.com/AkF2k/MAGosSAkF2k/1/s2/canva-untitled-MAGosSAkF2k.jpg" width="300">

<h2>Links</h2>
<p>Here is a link with lots of cats: <a href="https://www.canva.com/photos/s/cat/">cat images</a></p>

<h2>Cat Video</h2>
<p>Here is a cat video, enjoy:</p>

<video width="400" autoplay loop muted>
  <source src="cat-video.mp4" type="video/mp4">
  Your browser does not support the video tag.
</video>

</div>
</body>
</html>
